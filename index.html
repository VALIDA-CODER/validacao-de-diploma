<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Diploma</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.25);
    }

    h1 {
      color: #ff6600;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitulo {
      color: #ccc;
      margin-bottom: 30px;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #ff6600;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #ff6600;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e65c00;
    }

    #resultado {
      margin-top: 25px;
      text-align: left;
    }

    .dados {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
    }

    .dados p {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .dados strong {
      color: #ff6600;
    }

    .botao-pdf {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #ff6600;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: bold;
    }

    .botao-pdf:hover {
      background: #e65c00;
    }

    .erro {
      color: #ff5555;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Validação de Diploma</h1>

    <p class="subtitulo">
      Digite o código de validação presente no diploma.
    </p>

    <input
      type="text"
      id="codigo"
      placeholder="Digite o código"
      autocomplete="off"
    >

    <button onclick="validarDiploma()">
      VALIDAR DIPLOMA
    </button>

    <div id="resultado"></div>

  </div>

  <script>

    const documentos = {

      "bk12opf": {
        nome: "Larissa Helena de Azevedo Mendes",
        curso: "Direito",
        instituicao: "São Judas – Campus Unimonte",
        codigo: "bk12opf",
        arquivo: "DIPLOMA LARISSA.pdf"
      }

    };


    function validarDiploma() {

      const codigo = document
        .getElementById("codigo")
        .value
        .trim()
        .toLowerCase();

      const resultado = document.getElementById("resultado");

      if (documentos[codigo]) {

        const diploma = documentos[codigo];

        resultado.innerHTML = `
          <div class="dados">

            <p>
              <strong>Nome:</strong><br>
              ${diploma.nome}
            </p>

            <p>
              <strong>Curso:</strong><br>
              ${diploma.curso}
            </p>

            <p>
              <strong>Instituição:</strong><br>
              ${diploma.instituicao}
            </p>

            <p>
              <strong>Código de validação:</strong><br>
              ${diploma.codigo}
            </p>

            <a
              class="botao-pdf"
              href="${diploma.arquivo}"
              target="_blank"
            >
              ABRIR DIPLOMA
            </a>

          </div>
        `;

      } else {

        resultado.innerHTML = `
          <p class="erro">
            Código não encontrado. Verifique o código informado.
          </p>
        `;

      }
    }


    const parametros = new URLSearchParams(window.location.search);
    const codigoUrl = parametros.get("codigo");

    if (codigoUrl) {
      document.getElementById("codigo").value = codigoUrl;
      validarDiploma();
    }

  </script>

</body>
</html>
