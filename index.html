<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validação de Diploma</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 22px;
    text-align: center;
}

header span {
    color: #f47b20;
}

.container {
    max-width: 520px;
    margin: 70px auto;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    text-align: center;
}

h1 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 15px;
    margin: 20px 0 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #f47b20;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #d9630e;
}

#resultado {
    margin-top: 25px;
}

.valido {
    padding: 20px;
    background: #edf8ef;
    border: 1px solid #b8dfbd;
    border-radius: 10px;
}

.invalido {
    padding: 20px;
    background: #fff0f0;
    border: 1px solid #e0b5b5;
    border-radius: 10px;
}

a {
    display: inline-block;
    margin-top: 15px;
    color: #f47b20;
    font-weight: bold;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
    <strong>Validação <span>de Diploma</span></strong>
</header>

<div class="container">

```
<h1>Validar Diploma</h1>

<p>
    Digite o código de validação presente no diploma.
</p>

<input
    type="text"
    id="codigo"
    placeholder="Digite o código"
    value=""
>

<button onclick="validar()">
    VALIDAR CÓDIGO
</button>

<div id="resultado"></div>
```

</div>

<script>

function validar() {

    const codigo = document
        .getElementById("codigo")
        .value
        .trim()
        .toLowerCase();

    const resultado = document.getElementById("resultado");

    if (codigo === "bk12opf") {

    resultado.innerHTML = `
        <div class="valido">
            <strong>✅ DIPLOMA VÁLIDO</strong>

            <p>
                <strong>Nome:</strong><br>
                Larissa Helena de Azevedo Mendes
            </p>

            <p>
                <strong>Curso:</strong><br>
                Direito
            </p>

            <p>
                <strong>Instituição:</strong><br>
                São Judas – Campus Unimonte
            </p>

            <p>
                <strong>Código de validação:</strong><br>
                bk12opf
            </p>

            <a href="diploma-teste.pdf" target="_blank">
                📄 ABRIR DIPLOMA
            </a>
        </div>
    `;

} else {

        resultado.innerHTML = `
            <div class="invalido">
                <strong>❌ CÓDIGO NÃO ENCONTRADO</strong>

                <p>
                    Verifique o código informado e tente novamente.
                </p>
            </div>
        `;
    }
}

</script>

</body>
</html>
