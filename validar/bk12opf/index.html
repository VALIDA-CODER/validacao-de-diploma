<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Validação de Diploma</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 22px;
    text-align: center;
}

header span {
    color: #f47b20;
}

.container {
    max-width: 520px;
    margin: 70px auto;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    text-align: center;
}

.valido {
    padding: 25px;
    background: #edf8ef;
    border: 1px solid #b8dfbd;
    border-radius: 10px;
}

.valido strong {
    font-size: 18px;
}

.info {
    margin: 18px 0;
    line-height: 1.6;
}

a {
    display: inline-block;
    margin-top: 15px;
    padding: 14px 22px;
    background: #f47b20;
    color: white;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <strong>Validação <span>de Diploma</span></strong>
</header>

<div class="container">

    <div class="valido">

        <strong>✅ DIPLOMA VÁLIDO</strong>

        <div class="info">

            <p>
                <strong>Nome:</strong><br>
                Larissa Helena de Azevedo Mendes
            </p>

            <p>
                <strong>Curso:</strong><br>
                Direito
            </p>

            <p>
                <strong>Instituição:</strong><br>
                São Judas – Campus Unimonte
            </p>

            <p>
                <strong>Código de validação:</strong><br>
                bk12opf
            </p>

        </div>

        <a href="../../diploma-teste.pdf" target="_blank">
            📄 ABRIR DIPLOMA
        </a>

    </div>

</div>

</html>
